<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال پیام به من</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 14px;
        }
        textarea {
            height: 120px;
            resize: none;
        }
        button {
            background: #ff758c;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #ff7eb3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>ارسال نامه ✉️</h2>
        <p>هر پیامی داری اینجا بنویس، مستقیم یک سال بعد به مه میایه!</p>
        
        <form action="https://formsubmit.co/faisal@selenic.io" method="POST">
            <input type="text" name="name" placeholder="اسمت (اختیاری)">
            <textarea name="message" placeholder="پیامت را اینجا بنویس..." required></textarea>
            <input type="hidden" name="_captcha" value="false">
            <button type="submit">ارسال پیام 🚀</button>
        </form>
    </div>
</body>
</html>
